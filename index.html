<!DOCTYPE html>
<html lang="lo">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ລະບົບຫຼັງຮ້ານ POS</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A7%BE%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao+Looped:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF2EF; --paper:#FFFFFF; --ink:#1B2A24; --muted:#5E6E67; --line:#D5DDD8;
  --jade:#0E7C5A; --jade-soft:#DDF0E8; --gold:#C8961A; --gold-soft:#FBF1D6;
  --red:#B4232C; --red-soft:#FBE3E4; --radius:10px;
  --font:"Noto Sans Lao Looped","Noto Sans Lao","Phetsarath OT",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.55;
  padding-top:env(safe-area-inset-top,0px)}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
a{color:var(--jade)}

/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:220px 1fr;min-height:100%}
nav.side{background:var(--ink);color:#E8EFEB;padding:20px 12px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{font-weight:700;font-size:18px;padding:4px 10px 18px;border-bottom:1px solid #33463e;margin-bottom:12px}
.brand small{display:block;font-weight:400;font-size:12px;color:#9FB3AA}
nav.side button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;
  padding:10px 12px;border-radius:8px;color:#CFDCD5;cursor:pointer}
nav.side button:hover{background:#27392F}
nav.side button.active{background:var(--jade);color:#fff}
nav.side .ico{width:22px;text-align:center}
main{padding:24px clamp(14px,3vw,36px) 90px;min-width:0}
h1{font-size:24px;margin:0 0 18px;font-weight:700}
h2{font-size:17px;margin:0 0 12px;font-weight:600}
.view{display:none}.view.active{display:block}

/* ---------- blocks ---------- */
.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
.grid{display:grid;gap:16px}
.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.stat .lbl{color:var(--muted);font-size:13px}
.stat .val{font-size:26px;font-weight:700}
.stat .sub{font-size:13px;color:var(--muted)}
.stat.warn{border-color:#E7B8BB;background:var(--red-soft)}
.mt{margin-top:16px}

.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-weight:600;color:var(--muted);font-size:13px;background:#F6F8F7}
td.r,th.r{text-align:right}
tr.click{cursor:pointer}tr.click:hover td{background:#F4F8F6}

.btn{border:1px solid var(--line);background:var(--paper);padding:8px 14px;border-radius:8px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--jade)}
.btn.pri{background:var(--jade);border-color:var(--jade);color:#fff}
.btn.pri:hover{filter:brightness(1.08)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#fff}
.btn.danger{color:var(--red);border-color:#E7B8BB}
.btn.sm{padding:4px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:wait}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

label.f{display:block;font-size:13px;color:var(--muted);margin-bottom:10px}
label.f input,label.f select,label.f textarea,.inp{display:block;width:100%;margin-top:4px;padding:9px 11px;
  border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
.inp.inline{display:inline-block;width:auto;margin:0}
textarea{min-height:70px;resize:vertical}

.tag{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12px;font-weight:600}
.tag.paid{background:var(--jade-soft);color:var(--jade)}
.tag.unpaid{background:var(--red-soft);color:var(--red)}
.tag.in{background:var(--jade-soft);color:var(--jade)}
.tag.out{background:var(--gold-soft);color:#8a6510}
.empty{padding:28px;text-align:center;color:var(--muted)}
.thumb{width:40px;height:40px;border-radius:6px;object-fit:cover;background:#E4EAE6}

/* ---------- POS ---------- */
.pos{display:grid;grid-template-columns:1fr 380px;gap:18px;align-items:start}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.pcard{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:8px;cursor:pointer;text-align:left}
.pcard:hover{border-color:var(--jade)}
.pcard img,.pcard .noimg{width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px;background:#E4EAE6;display:block}
.pcard .noimg{display:grid;place-items:center;font-size:28px;color:#9FB3AA}
.pcard .nm{font-weight:600;font-size:14px;margin-top:6px;line-height:1.35}
.pcard .pr{color:var(--jade);font-weight:700}
.pcard .st{font-size:12px;color:var(--muted)}
.pcard.low .st{color:var(--red)}

/* the ticket: paper slip with perforated bottom */
.ticket{background:var(--paper);border-radius:12px 12px 0 0;padding:18px 18px 26px;position:sticky;top:16px;
  box-shadow:0 1px 0 var(--line),0 12px 30px -18px rgba(27,42,36,.45);
  -webkit-mask:radial-gradient(circle 7px at 50% 100%,#0000 98%,#000) 50% 100%/18px 100% repeat-x;
          mask:radial-gradient(circle 7px at 50% 100%,#0000 98%,#000) 50% 100%/18px 100% repeat-x}
.ticket .head{border-bottom:2px dashed var(--line);padding-bottom:10px;margin-bottom:10px}
.ticket .line{display:grid;grid-template-columns:1fr 70px 88px 24px;gap:6px;align-items:center;padding:6px 0;border-bottom:1px dotted var(--line)}
.ticket .line input{padding:5px 6px;border:1px solid var(--line);border-radius:6px;width:100%;text-align:right}
.ticket .line .x{background:none;border:0;color:var(--red);cursor:pointer;font-size:18px}
.ticket .total{display:flex;justify-content:space-between;font-size:22px;font-weight:700;padding:12px 0;border-top:2px dashed var(--line);margin-top:8px}
.ticket .lines{max-height:40vh;overflow:auto}

/* ---------- modal & toast ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(20,30,26,.5);display:none;align-items:flex-start;justify-content:center;
  padding:max(24px,env(safe-area-inset-top,0px)) 12px 24px;z-index:50;overflow:auto}
.modal-bg.open{display:flex}
.modal{background:var(--paper);border-radius:14px;width:min(640px,100%);padding:20px;animation:pop .16s ease-out}
.modal .mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.modal .mh h2{margin:0}
.modal .close{background:none;border:0;font-size:24px;cursor:pointer;color:var(--muted)}
@keyframes pop{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;z-index:60;display:none;max-width:90vw}
#toast.err{background:var(--red)}
#loader{position:fixed;top:0;left:0;height:3px;background:var(--gold);width:0;z-index:70;transition:width .3s}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- mobile ---------- */
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  nav.side{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;z-index:40;display:flex;overflow-x:auto;
    padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));gap:2px}
  .brand{display:none}
  nav.side button{flex-direction:column;gap:0;font-size:11px;padding:6px 10px;min-width:64px;align-items:center;text-align:center}
  nav.side .ico{font-size:18px}
  .pos{grid-template-columns:1fr}
  .ticket{position:static;order:-1;margin-bottom:6px}
  .ticket .lines{max-height:34vh}
  main{padding-bottom:110px}
}
</style>
</head>
<body>
<div id="loader"></div>
<div class="app">
  <nav class="side" id="nav">
    <div class="brand" id="brandName">ລະບົບຫຼັງຮ້ານ<small id="brandSub">POS Back-office</small></div>
    <button data-v="dash"><span class="ico">📊</span>ພາບລວມ</button>
    <button data-v="pos"><span class="ico">🧾</span>ຂາຍສິນຄ້າ</button>
    <button data-v="products"><span class="ico">📦</span>ສິນຄ້າ</button>
    <button data-v="stock"><span class="ico">🔁</span>ເຂົ້າ-ອອກສະຕັອກ</button>
    <button data-v="invoices"><span class="ico">📄</span>ໃບບິນ</button>
    <button data-v="customers"><span class="ico">👥</span>ລູກຄ້າ</button>
    <button data-v="debts"><span class="ico">📒</span>ໜີ້ລູກຄ້າ</button>
    <button data-v="settings"><span class="ico">⚙️</span>ຕັ້ງຄ່າ</button>
  </nav>

  <main>
    <!-- DASHBOARD -->
    <section class="view" id="v-dash">
      <div class="row"><h1>ພາບລວມຮ້ານ</h1><span class="spacer"></span><button class="btn" onclick="loadDash()">ໂຫຼດໃໝ່</button></div>
      <div id="dashBody"><div class="empty">ກຳລັງໂຫຼດ...</div></div>
    </section>

    <!-- POS -->
    <section class="view" id="v-pos">
      <div class="pos">
        <div>
          <div class="row" style="margin-bottom:14px">
            <h1 style="margin:0">ຂາຍສິນຄ້າ</h1><span class="spacer"></span>
            <button class="btn" onclick="showOpenTickets()">ບິນຄ້າງ <span id="otCount"></span></button>
          </div>
          <input class="inp" id="posSearch" placeholder="ຄົ້ນຫາຊື່ສິນຄ້າ ຫຼື SKU" style="margin-bottom:14px">
          <div class="pgrid" id="posGrid"></div>
        </div>
        <div class="ticket" id="ticket"></div>
      </div>
    </section>

    <!-- PRODUCTS -->
    <section class="view" id="v-products">
      <div class="row"><h1>ສິນຄ້າ</h1><span class="spacer"></span><button class="btn pri" onclick="productForm()">+ ເພີ່ມສິນຄ້າ</button></div>
      <div class="row" style="margin-bottom:14px"><input class="inp" id="prodSearch" placeholder="ຄົ້ນຫາຊື່, SKU, ປະເພດ" style="flex:1;min-width:200px;margin:0">
        <select class="inp inline" id="prodFilter" aria-label="ກັ່ນຕອງ"></select><button class="btn" onclick="exportProducts()">ດາວໂຫຼດ CSV</button></div>
      <div class="panel tbl-wrap" id="prodTable"></div>
    </section>

    <!-- STOCK -->
    <section class="view" id="v-stock">
      <div class="row"><h1>ເຂົ້າ-ອອກສະຕັອກ</h1><span class="spacer"></span><button class="btn pri" onclick="stockForm()">+ ບັນທຶກລາຍການ</button></div>
      <div class="row" style="margin-bottom:14px">
        <input class="inp" id="sxSearch" placeholder="ຄົ້ນຫາສິນຄ້າ ຫຼື ໝາຍເຫດ" style="flex:1;min-width:180px;margin:0">
        <select class="inp inline" id="sxType"><option value="all">ທຸກປະເພດ</option><option value="Stock In">ເຂົ້າ</option><option value="Stock Out">ອອກ</option></select>
        <input class="inp inline" type="date" id="sxFrom" title="ແຕ່ວັນທີ"><input class="inp inline" type="date" id="sxTo" title="ເຖິງວັນທີ">
        <button class="btn" onclick="exportStock()">ດາວໂຫຼດ CSV</button></div>
      <div class="panel tbl-wrap" id="stockTable"></div>
    </section>

    <!-- INVOICES -->
    <section class="view" id="v-invoices">
      <div class="row"><h1>ໃບບິນ</h1><span class="spacer"></span>
        <select class="inp inline" id="invFilter"><option value="all">ທັງໝົດ</option><option value="Unpaid">ຍັງບໍ່ຈ່າຍ</option><option value="Paid">ຈ່າຍແລ້ວ</option></select>
      </div>
      <div class="row" style="margin-bottom:14px">
        <input class="inp" id="invSearch" placeholder="ຄົ້ນຫາເລກບິນ, ລູກຄ້າ, ເບີໂທ" style="flex:1;min-width:180px;margin:0">
        <select class="inp inline" id="invPay"><option value="all">ທຸກວິທີຊຳລະ</option><option value="Cash">ເງິນສົດ</option><option value="Transfer">ເງິນໂອນ</option><option value="Cash+Transfer">ສົດ + ໂອນ</option></select>
        <input class="inp inline" type="date" id="invFrom" title="ແຕ່ວັນທີ"><input class="inp inline" type="date" id="invTo" title="ເຖິງວັນທີ">
        <button class="btn" onclick="exportInvoices()">ດາວໂຫຼດ CSV</button></div>
      <div class="panel tbl-wrap" id="invTable"></div>
    </section>

    <!-- CUSTOMERS -->
    <section class="view" id="v-customers">
      <div class="row"><h1>ລູກຄ້າ</h1><span class="spacer"></span><button class="btn pri" onclick="customerForm()">+ ເພີ່ມລູກຄ້າ</button></div>
      <input class="inp" id="custSearch" placeholder="ຄົ້ນຫາຊື່ ຫຼື ເບີໂທ" style="margin-bottom:14px">
      <div class="panel tbl-wrap" id="custTable"></div>
    </section>

    <!-- DEBTS -->
    <section class="view" id="v-debts">
      <div class="row"><h1>ໜີ້ລູກຄ້າ</h1><span class="spacer"></span>
        <select class="inp inline" id="debtBook" title="ເລືອກປຶ້ມໜີ້">
          <option value="1">ປຶ້ມໜີ້ 1</option><option value="2">ປຶ້ມໜີ້ 2</option><option value="3">ປຶ້ມໜີ້ 3</option>
        </select>
        <button class="btn pri" onclick="debtForm()">+ ບັນທຶກໜີ້</button>
      </div>
      <div id="debtSummary" class="grid g3" style="margin-bottom:16px"></div>
      <div class="row" style="margin-bottom:14px">
        <input class="inp" id="debtSearch" placeholder="ພິມຊື່ລູກຄ້າ ເພື່ອເບິ່ງຍອດລວມ" style="flex:1;min-width:200px">
        <select class="inp inline" id="debtFilter"><option value="all">ທັງໝົດ</option><option value="Unpaid">ຍັງຄ້າງ</option><option value="Paid">ຈ່າຍແລ້ວ</option></select>
        <button class="btn" onclick="debtCustomerSummary()">ເບິ່ງຍອດລູກຄ້າ</button>
        <button class="btn" onclick="exportDebts()">ດາວໂຫຼດ CSV</button>
      </div>
      <div class="panel tbl-wrap" id="debtTable"></div>
    </section>

    <!-- SETTINGS -->
    <section class="view" id="v-settings">
      <h1>ຕັ້ງຄ່າ</h1>
      <div class="grid g2">
        <div class="panel">
          <h2>ການເຊື່ອມຕໍ່ Google Sheets</h2>
          <label class="f">URL ຂອງ Web App (ລົງທ້າຍດ້ວຍ /exec)<input id="cfgUrl" placeholder="https://script.google.com/macros/s/.../exec"></label>
          <label class="f">ລະຫັດ API (API_TOKEN ໃນ Api.gs)<input id="cfgToken" type="password"></label>
          <button class="btn pri" onclick="saveConn()">ບັນທຶກ ແລະ ທົດສອບ</button>
          <p class="sub" style="font-size:13px;color:var(--muted)">ຂໍ້ມູນນີ້ເກັບໄວ້ໃນບຣາວເຊີເຄື່ອງນີ້ເທົ່ານັ້ນ.</p>
        </div>
        <div class="panel">
          <h2>ຂໍ້ມູນຮ້ານ</h2>
          <label class="f">ຊື່ຮ້ານ<input id="sName"></label>
          <label class="f">ເບີໂທ<input id="sPhone"></label>
          <label class="f">ທີ່ຢູ່<input id="sAddr"></label>
          <label class="f">ຂໍ້ຄວາມຫົວບິນ (ເຊັ່ນ ເລກບັນຊີ, ເວລາເປີດ-ປິດ)<textarea id="sHead"></textarea></label>
          <label class="f">ຂໍ້ຄວາມທ້າຍບິນ (ຫວ່າງ = ຂອບໃຈທີ່ອຸດໜູນ)<textarea id="sFoot"></textarea></label>
          <label class="f">ຮູບ QR ຮັບເງິນໂອນ<input type="file" id="sQrFile" accept="image/*"></label>
          <div id="sQrPrev"></div>
          <label class="f">Gemini API Key (ສຳລັບອ່ານຮູບໃບໜີ້ດ້ວຍ AI) <span id="sKeyState"></span>
            <input id="sKey" type="password" placeholder="ປ່ອຍຫວ່າງ = ບໍ່ປ່ຽນ"></label>
          <button class="btn pri" onclick="saveShop()">ບັນທຶກຂໍ້ມູນຮ້ານ</button>
        </div>
        <div class="panel">
          <div class="row"><h2 style="margin:0">ໜ່ວຍນັບ</h2><span class="spacer"></span><button class="btn sm" onclick="unitForm()">+ ເພີ່ມ</button></div>
          <div id="unitList" class="mt"></div>
        </div>
        <div class="panel">
          <h2>ກວດສອບລະບົບ</h2>
          <p style="font-size:13px;color:var(--muted);margin-top:0">ກວດວ່າເຊື່ອມກັບ Google Sheet ຖືກໄຟລ໌ ແລະ ອ່ານຂໍ້ມູນແຕ່ລະແທັບໄດ້</p>
          <button class="btn" onclick="runDebug()">ກວດສອບດຽວນີ້</button>
          <pre id="dbgOut" style="white-space:pre-wrap;font-size:12px;max-height:320px;overflow:auto;margin-bottom:0"></pre>
        </div>
      </div>
    </section>
  </main>
</div>

<div class="modal-bg" id="modalBg"><div class="modal" role="dialog" aria-modal="true">
  <div class="mh"><h2 id="mTitle"></h2><button class="close" onclick="closeModal()" aria-label="ປິດ">×</button></div>
  <div id="mBody"></div>
</div></div>
<div id="toast"></div>

<script>
/* ======================= CONFIG / API ======================= */
// URL ເລີ່ມຕົ້ນຂອງ Web App (ປ່ຽນໄດ້ໃນໜ້າຕັ້ງຄ່າ)
const DEFAULT_API_URL = 'https://script.google.com/macros/s/AKfycbwrHaN5ImI-TJ7dTJ0IzR6cAgo3LZg87Hu9fbRY44607Y9u5Npidc0fz1-iGOie9Ww2PA/exec';
const DEFAULT_API_TOKEN = '123';
const store = {
  get(k){ try{ return localStorage.getItem(k) || '' }catch(e){ return '' } },
  set(k,v){ try{ localStorage.setItem(k,v) }catch(e){} }
};
let pending = 0;
function busy(d){ pending += d; const l = document.getElementById('loader'); l.style.width = pending > 0 ? '70%' : '0'; }

async function api(fn, ...args){
  const url = store.get('pos_api_url') || DEFAULT_API_URL, token = store.get('pos_api_token') || DEFAULT_API_TOKEN;
  if(!url){ go('settings'); throw new Error('ກະລຸນາຕັ້ງຄ່າ URL ຂອງ Web App ກ່ອນ'); }
  busy(1);
  try{
    const res = await fetch(url, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({ token, fn, args }) });
    const txt = await res.text();
    let j;
    try{ j = JSON.parse(txt); }
    catch(e){
      const m = txt.match(/<title>([^<]*)<\/title>/i);
      const t = (m ? m[1] : txt.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim()).slice(0, 120);
      console.error('Apps Script ສົ່ງ HTML ກັບມາ (' + fn + '):', txt.slice(0, 1000));
      throw new Error('Apps Script ຕອບເປັນ HTML ບໍ່ແມ່ນ JSON [' + fn + ']: ' + t);
    }
    if(!j.ok) throw new Error(j.error || 'ເກີດຂໍ້ຜິດພາດ');
    return j.data;
  }catch(e){
    if(e instanceof TypeError) throw new Error('ເຊື່ອມຕໍ່ບໍ່ໄດ້: ກວດ URL ແລະ ການ Deploy (Anyone)');
    throw e;
  }finally{ busy(-1) }
}

/* ======================= HELPERS ======================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const N = v => Number(v) || 0;
const money = n => N(n).toLocaleString('en-US', {maximumFractionDigits:2}) + ' ₭';
const fmtDate = d => { if(!d) return ''; const x = new Date(d); return isNaN(x) ? esc(d) : x.toLocaleDateString('en-GB') + ' ' + x.toTimeString().slice(0,5); };
const fmtDay = d => { if(!d) return ''; const x = new Date(d); return isNaN(x) ? esc(d) : x.toLocaleDateString('en-GB'); };
const today = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0,10); };
const pad2 = n => String(n).padStart(2, '0');
const ymd = d => { const x = new Date(d); return isNaN(x) ? '' : x.getFullYear() + '-' + pad2(x.getMonth()+1) + '-' + pad2(x.getDate()); };
const inRange = (d, from, to) => { const y = ymd(d); return (!from || y >= from) && (!to || y <= to); };
// ປັບຕົວອັກສອນລາວ (ຫນ→ໜ, ຫມ→ໝ) ເພື່ອຄົ້ນຫາໃຫ້ເຈິ
const norm = s => String(s ?? '').normalize('NFC').toLowerCase()
  .replace(/\u0EAB\u0E99/g, '\u0EDC').replace(/\u0EAB\u0EA1/g, '\u0EDD').replace(/[\u200B-\u200D\uFEFF\s]+/g, ' ').trim();
function downloadCSV(name, rows){
  const csv = '\ufeff' + rows.map(r => r.map(v => `"${String(v ?? '').replace(/"/g, '""')}"`).join(',')).join('\r\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type:'text/csv;charset=utf-8' }));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
}
const statusTag = s => s === 'Paid' ? '<span class="tag paid">ຈ່າຍແລ້ວ</span>' : '<span class="tag unpaid">ຍັງບໍ່ຈ່າຍ</span>';

function toast(msg, err){ const t = $('#toast'); t.textContent = msg; t.className = err ? 'err' : ''; t.style.display = 'block';
  clearTimeout(toast._t); toast._t = setTimeout(() => t.style.display = 'none', 3200); }
async function run(fn, okMsg){ try{ const r = await fn(); if(r && r.success === false) throw new Error(r.message); if(okMsg) toast(okMsg); return r; }
  catch(e){ toast(e.message, true); return null; } }

function openModal(title, html){ $('#mTitle').textContent = title; $('#mBody').innerHTML = html; $('#modalBg').classList.add('open'); }
function closeModal(){ $('#modalBg').classList.remove('open'); }
$('#modalBg').addEventListener('click', e => { if(e.target.id === 'modalBg') closeModal(); });

// ຫຍໍ້ຮູບກ່ອນສົ່ງ (ປະຢັດເນັດ ແລະ ໄວຂຶ້ນ)
function fileToBase64(file, maxDim = 1600){
  return new Promise((resolve, reject) => {
    const img = new Image(), fr = new FileReader();
    fr.onload = () => { img.src = fr.result; };
    fr.onerror = reject;
    img.onload = () => {
      const k = Math.min(1, maxDim / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width*k); c.height = Math.round(img.height*k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      resolve({ base64: c.toDataURL('image/jpeg', .85).split(',')[1], mime:'image/jpeg' });
    };
    img.onerror = () => reject(new Error('ອ່ານຮູບບໍ່ໄດ້'));
    fr.readAsDataURL(file);
  });
}

// ກົດ Enter (ຫຼື ສະແກນບາໂຄດ) → ເພີ່ມສິນຄ້າທີ່ SKU ກົງກັນ
$('#posSearch').onkeydown = e => {
  if(e.key !== 'Enter') return;
  const q = e.target.value.trim().toLowerCase(); if(!q) return;
  const list = posList();
  const p = S.products.find(x => String(x.SKU).toLowerCase() === q) || (list.length === 1 ? list[0] : null);

  else toast(list.length ? 'ພົບຫຼາຍລາຍການ — ແຕະເລືອກສິນຄ້າ' : 'ບໍ່ພົບສິນຄ້ານີ້', true);

function renderPosGrid(){
  const list = posList();
  $('#posGrid').innerHTML = list.length ? list.map(p => `
    <button class="pcard ${Number(p.CurrentStock) <= Number(p.MinStock) ? 'low' : ''}" onclick="addToCart('${esc(p.ProductID)}')">
      ${p.ImageURL ? `<img src="${esc(p.ImageURL)}" alt="" loading="lazy">` : '<div class="noimg">📦</div>'}

    </button>`).join('') : '<div class="empty">ບໍ່ພົບສິນຄ້າ</div>';
}
const stockOf = id => { const p = S.products.find(x => String(x.ProductID) === String(id)); return p ? Number(p.CurrentStock) || 0 : Infinity; };
function addToCart(id){
  const p = S.products.find(x => String(x.ProductID) === String(id)); if(!p) return;
  const it = cart.items.find(x => x.productId === p.ProductID);
  const next = (it ? Number(it.quantity) : 0) + 1;
  if(next > stockOf(p.ProductID)) return toast(`"${p.ProductName}" ເຫຼືອພຽງ ${p.CurrentStock}`, true);
  if(it) it.quantity = next;
  else cart.items.push({ productId:p.ProductID, productName:p.ProductName, quantity:1, unitPrice:Number(p.SellingPrice)||0, unit:p.Unit||'' });
  renderTicket();
}
function setQty(k, v){
  const it = cart.items[k]; it.quantity = v;
  if(Number(v) > stockOf(it.productId)) toast(`"${it.productName}" ເຫຼືອພຽງ ${stockOf(it.productId)} — ກະລຸນາຫຼຸດຈຳນວນ`, true);
  renderTicket();
}
function setPay(v){
  cart.pay = v;
  if(v === 'Split' && cart.cash === '' && cart.transfer === ''){ cart.cash = cartTotal(); cart.transfer = 0; }
  renderTicket();
}
function cartTotal(){ return cart.items.reduce((s,i) => s + (Number(i.quantity)||0)*(Number(i.unitPrice)||0), 0); }

        <input class="inp" placeholder="ຊື່ລູກຄ້າ" value="${esc(cart.customerName)}" oninput="cart.customerName=this.value" style="flex:1;margin:0">
        <input class="inp" placeholder="ເບີໂທ" value="${esc(cart.phone)}" oninput="cart.phone=this.value" style="flex:1;margin:0">
      </div>

        <input type="number" min="0" value="${esc(i.unitPrice)}" onchange="cart.items[${k}].unitPrice=this.value;renderTicket()" aria-label="ລາຄາ">
        <button class="x" onclick="cart.items.splice(${k},1);renderTicket()" aria-label="ລົບ">×</button>
      </div>`).join('') : '<div class="empty">ແຕະສິນຄ້າ ຫຼື ສະແກນ SKU ເພື່ອເພີ່ມເຂົ້າບິນ</div>'}</div>
    <div class="total"><span>ລວມ</span><span class="num">${money(total)}</span></div>
    <div class="row">
      <select class="inp" style="flex:1;margin:0" onchange="setPay(this.value)" aria-label="ວິທີຊຳລະ">

    </div>
    ${cart.pay === 'Cash' ? `<div class="row" style="margin-top:8px">

    ${cart.pay === 'Split' ? `<div class="row" style="margin-top:8px">

function updChange(){
  const el = $('#tChange'); if(!el) return;
  const r = Number(cart.received) || 0; if(!r){ el.textContent = ''; return; }
  const c = r - cartTotal();
  el.innerHTML = c >= 0 ? `ທອນ <b>${money(c)}</b>` : `<span style="color:var(--red)">ຂາດ ${money(-c)}</span>`;
}
function clearCart(){ cart = newCart(); renderTicket(); }

// ລາຍເຊັນລູກຄ້າ (ເກັບໃນຖັນ Signature ຂອງໃບບິນ)
function signPad(){
  openModal('ລາຍເຊັນລູກຄ້າ', `<canvas id="sig" width="600" height="220" style="width:100%;border:1px dashed var(--line);border-radius:8px;touch-action:none;background:#fff"></canvas>
    <div class="row mt"><button class="btn" id="sigClear">ລ້າງ</button><span class="spacer"></span><button class="btn pri" id="sigOk">ໃຊ້ລາຍເຊັນນີ້</button></div>`);
  const c = $('#sig'), x = c.getContext('2d'); let drawing = false, used = false;
  x.lineWidth = 3; x.lineCap = 'round'; x.lineJoin = 'round'; x.strokeStyle = '#1B2A24';
  const pos = e => { const r = c.getBoundingClientRect(); return [(e.clientX - r.left) * c.width / r.width, (e.clientY - r.top) * c.height / r.height]; };
  if(cart.signature){ const im = new Image(); im.onload = () => x.drawImage(im, 0, 0, c.width, c.height); im.src = cart.signature; used = true; }
  c.onpointerdown = e => { drawing = true; used = true; c.setPointerCapture(e.pointerId); x.beginPath(); x.moveTo(...pos(e)); };
  c.onpointermove = e => { if(!drawing) return; x.lineTo(...pos(e)); x.stroke(); };
  c.onpointerup = c.onpointercancel = () => drawing = false;
  $('#sigClear').onclick = () => { x.clearRect(0, 0, c.width, c.height); used = false; };
  $('#sigOk').onclick = () => {
    if(used){ const s = document.createElement('canvas'); s.width = 300; s.height = 110; const sx = s.getContext('2d');
      sx.fillStyle = '#fff'; sx.fillRect(0, 0, 300, 110); sx.drawImage(c, 0, 0, 300, 110); cart.signature = s.toDataURL('image/jpeg', .7); }
    else cart.signature = '';
    closeModal(); renderTicket();
  };
}

async function loadTicket(id){

  cart = { ...newCart(), ticketId:r.ticket.TicketID, ticketName:r.ticket.TicketName||'', customerId:r.ticket.CustomerID||'',
    customerName:r.ticket.CustomerName||'', phone:String(r.ticket.Phone||''), items:r.items||[] };

async function delTicket(id){ if(!confirm('ລົບບິນຄ້າງນີ້?')) return;

async function checkout(){
  const total = cartTotal();
  for(const i of cart.items){
    if(!(Number(i.quantity) > 0)) return toast(`ຈຳນວນຂອງ "${i.productName}" ບໍ່ຖືກຕ້ອງ`, true);
    if(Number(i.quantity) > stockOf(i.productId)) return toast(`"${i.productName}" ເຫຼືອພຽງ ${stockOf(i.productId)}`, true);
  }
  let cash = 0, transfer = 0;
  if(cart.pay === 'Split'){ cash = Number(cart.cash)||0; transfer = Number(cart.transfer)||0;
    if(Math.abs(cash + transfer - total) > 0.001) return toast('ຍອດສົດ + ໂອນ ຕ້ອງເທົ່າກັບ ' + money(total), true); }
  if(cart.status === 'Unpaid' && !String(cart.customerName).trim() && !confirm('ບິນຕິດໜີ້ແຕ່ບໍ່ມີຊື່ລູກຄ້າ. ບັນທຶກຕໍ່ບໍ?')) return;
  $('#btnCheckout').disabled = true;
  const sale = { customerId:cart.customerId, customerName:cart.customerName, phone:cart.phone,
    paymentMethod: cart.pay === 'Split' ? 'Cash+Transfer' : cart.pay, paymentStatus:cart.status, note:cart.note, signature:cart.signature,
    items: cart.items.map(i => ({ productId:i.productId, quantity:Number(i.quantity), unitPrice:Number(i.unitPrice) })) };
  if(cart.date) sale.date = cart.date;
  const r = await run(() => api('recordSale', sale));
  if(!r){ $('#btnCheckout').disabled = false; return; }
  if(cart.pay === 'Split') await run(() => api('setInvoiceSplitAmounts', r.invoiceNo, 'Cash+Transfer', cash, transfer));
  if(cart.ticketId) await run(() => api('deleteOpenTicket', cart.ticketId));
  const change = cart.pay === 'Cash' && Number(cart.received) > total ? Number(cart.received) - total : 0;
  toast(change ? 'ຂາຍສຳເລັດ — ທອນ ' + money(change) : 'ຂາຍສຳເລັດ');
  clearCart(); loadPos(); showInvoice(r.invoiceNo);
}

async function delProduct(id){ if(!confirm('ລົບສິນຄ້ານີ້?')) return; if(await run(() => api('deleteProduct', id), 'ລົບແລ້ວ')) loadProducts(); }

/* ======================= STOCK ======================= */
let TX = [];
async function loadStock(){ const [t] = await Promise.all([api('getTransactions'), refreshBase()]); TX = t; renderStock(); }
['#sxType','#sxSearch','#sxFrom','#sxTo'].forEach(id => $(id).addEventListener('input', renderStock));
function filteredTx(){
  const ty = $('#sxType').value, q = norm($('#sxSearch').value), from = $('#sxFrom').value, to = $('#sxTo').value;
  return TX.filter(t => (ty === 'all' || t.Type === ty) && (!q || norm(t.ProductName + ' ' + t.Note).includes(q)) && inRange(t.Date, from, to));
}
function renderStock(){
  const list = filteredTx();
  const tin = list.filter(t => t.Type === 'Stock In').reduce((s,t) => s + (Number(t.Quantity)||0), 0);
  const tout = list.filter(t => t.Type === 'Stock Out').reduce((s,t) => s + (Number(t.Quantity)||0), 0);
  $('#stockTable').innerHTML = list.length ? `<table><tr><th>ວັນທີ</th><th>ປະເພດ</th><th>ສິນຄ້າ</th><th class="r">ຈຳນວນ</th><th>ໝາຍເຫດ</th><th>ຜູ້ບັນທຶກ</th><th></th></tr>
    ${list.map(t => `<tr><td>${fmtDate(t.Date)}</td><td>${t.Type === 'Stock In' ? '<span class="tag in">ເຂົ້າ</span>' : '<span class="tag out">ອອກ</span>'}</td>
      <td>${esc(t.ProductName)}</td><td class="r num">${t.Quantity}</td><td>${esc(t.Note)}</td><td><small>${esc(t.RecordedBy)}</small></td>
      <td class="r" style="white-space:nowrap"><button class="btn sm" onclick="stockForm('${esc(t.TxID)}')">ແກ້ໄຂ</button>
        <button class="btn sm danger" onclick="delTx('${esc(t.TxID)}')">ລົບ</button></td></tr>`).join('')}</table>
    <div style="margin-top:10px;font-size:13px;color:var(--muted)" class="num">${list.length} ລາຍການ · ເຂົ້າລວມ ${tin} · ອອກລວມ ${tout}</div>`
    : '<div class="empty">ບໍ່ມີລາຍການ — ກົດ "+ ບັນທຶກລາຍການ" ເມື່ອຮັບເຄື່ອງເຂົ້າ</div>';
}
function exportStock(){
  downloadCSV('stock.csv', [['TxID','ວັນທີ','ປະເພດ','ສິນຄ້າ','ຈຳນວນ','ໝາຍເຫດ','ຜູ້ບັນທຶກ']]
    .concat(filteredTx().map(t => [t.TxID, fmtDate(t.Date), t.Type === 'Stock In' ? 'ເຂົ້າ' : 'ອອກ', t.ProductName, t.Quantity, t.Note, t.RecordedBy])));
}
async function stockForm(txId, presetPid){
  if(!S.products.length) await refreshBase();
  const t = TX.find(x => x.TxID === txId) || { Type:'Stock In', ProductID:presetPid };
  openModal(txId ? 'ແກ້ໄຂລາຍການສະຕັອກ' : 'ບັນທຶກເຂົ້າ-ອອກສະຕັອກ', `
    <label class="f">ປະເພດ<select id="xType">${opt('Stock In','ເຂົ້າ (ຮັບເຄື່ອງ)',t.Type)}${opt('Stock Out','ອອກ (ເສຍ, ໝົດອາຍຸ, ເອົາໄປໃຊ້)',t.Type)}</select></label>
    <label class="f">ສິນຄ້າ (ພິມຊື່ ຫຼື ລະຫັດ)<input id="xSearch" placeholder="ພິມຊື່ສິນຄ້າ ຫຼື SKU..." autocomplete="off"></label>
    <div id="xPick" style="font-size:14px;color:var(--jade);font-weight:600;margin:-4px 0 6px"></div>
    <div id="xList" style="max-height:230px;overflow:auto;border:1px solid var(--line);border-radius:8px;margin-bottom:12px"></div>
    <input type="hidden" id="xProd" value="${esc(t.ProductID || '')}">
    <label class="f">ຈຳນວນ<input id="xQty" type="number" step="any" value="${esc(t.Quantity ?? '')}"></label>
    <label class="f">ວັນທີ<input id="xDate" type="date" value="${t.Date ? ymd(t.Date) : today()}"></label>
    <label class="f">ໝາຍເຫດ<input id="xNote" value="${esc(t.Note)}"></label>
    <div class="row"><span class="spacer"></span><button class="btn" onclick="closeModal()">ຍົກເລີກ</button><button class="btn pri" id="xSave">ບັນທຶກ</button></div>`);
  const draw = () => {
    const q = norm($('#xSearch').value), cur = String($('#xProd').value);
    const all = S.products.filter(p => !q || norm(p.ProductName + ' ' + p.SKU).includes(q));
    const l = all.slice(0, 60), sel = S.products.find(p => String(p.ProductID) === cur);
    $('#xPick').textContent = sel ? '✓ ເລືອກແລ້ວ: ' + sel.ProductName + ' (ເຫຼືອ ' + sel.CurrentStock + ' ' + (sel.Unit || '') + ')' : '';
    $('#xList').innerHTML = l.length ? l.map(p => `<div data-id="${esc(p.ProductID)}" style="padding:10px 12px;cursor:pointer;border-bottom:1px solid var(--line);${String(p.ProductID) === cur ? 'background:var(--jade-soft);font-weight:600' : ''}">
      ${esc(p.ProductName)}<br><small style="color:var(--muted)">${esc(p.SKU || '-')} · ເຫຼືອ ${esc(p.CurrentStock)} ${esc(p.Unit || '')}</small></div>`).join('')
      + (all.length > 60 ? `<div class="empty">ສະແດງ 60 ຈາກ ${all.length} ລາຍການ — ພິມເພີ່ມເພື່ອກອງ</div>` : '')
      : '<div class="empty">ບໍ່ພົບສິນຄ້າ</div>';
  };
  $('#xSearch').oninput = draw;
  $('#xSearch').onkeydown = e => { if(e.key !== 'Enter') return; e.preventDefault(); const f = $('#xList [data-id]'); if(f) f.click(); };
  $('#xList').onclick = e => { const d = e.target.closest('[data-id]'); if(!d) return; $('#xProd').value = d.dataset.id; draw(); $('#xQty').focus(); };
  draw();
  setTimeout(() => (t.ProductID ? $('#xQty') : $('#xSearch')).focus(), 50);
  $('#xSave').onclick = async () => {
    const d = { txId, type:$('#xType').value, productId:$('#xProd').value, quantity:$('#xQty').value, date:$('#xDate').value, note:$('#xNote').value };
    if(!d.productId) return toast('ກະລຸນາເລືອກສິນຄ້າ (ແຕະລາຍການສິນຄ້າກ່ອນ)', true);
    $('#xSave').disabled = true;
    if(await run(() => api(txId ? 'updateStockTransaction' : 'recordStockTransaction', d), 'ບັນທຶກແລ້ວ')){ closeModal(); reloadActive(); }
    else $('#xSave').disabled = false;
  };
}
async function delTx(id){ if(!confirm('ລົບລາຍການນີ້? ສະຕັອກຈະຖືກປັບຄືນ')) return; if(await run(() => api('deleteStockTransaction', id), 'ລົບແລ້ວ')) loadStock(); }

/* ======================= INVOICES ======================= */
let INV = [];
async function loadInvoices(){ INV = await api('getInvoices'); renderInvoices(); }
['#invFilter','#invSearch','#invFrom','#invTo','#invPay'].forEach(id => $(id).addEventListener('input', renderInvoices));
const payLabel = m => ({ Cash:'ເງິນສົດ', Transfer:'ເງິນໂອນ', 'Cash+Transfer':'ສົດ + ໂອນ' }[m] || m || '');
function filteredInvoices(){
  const f = $('#invFilter').value, pm = $('#invPay').value, q = $('#invSearch').value.trim().toLowerCase(), from = $('#invFrom').value, to = $('#invTo').value;
  return INV.filter(i => (f === 'all' || i.PaymentStatus === f) && (pm === 'all' || i.PaymentMethod === pm) && inRange(i.Date, from, to) &&
    (!q || [i.InvoiceNo, i.CustomerName, i.Phone, i.Note].join(' ').toLowerCase().includes(q)));
}
function renderInvoices(){
  const list = filteredInvoices();
  const sum = list.reduce((s,i) => s + (Number(i.TotalAmount)||0), 0);
  const unpaid = list.filter(i => i.PaymentStatus === 'Unpaid').reduce((s,i) => s + (Number(i.TotalAmount)||0), 0);
  $('#invTable').innerHTML = list.length ? `<table><tr><th>ເລກບິນ</th><th>ວັນທີ</th><th>ລູກຄ້າ</th><th>ຊຳລະ</th><th class="r">ຍອດ</th><th>ສະຖານະ</th></tr>
    ${list.map(i => `<tr class="click" onclick="showInvoice('${esc(i.InvoiceNo)}')"><td class="num">${esc(i.InvoiceNo)}</td><td>${fmtDate(i.Date)}</td>
      <td>${esc(i.CustomerName || '-')}${i.Phone ? '<br><small>' + esc(i.Phone) + '</small>' : ''}</td><td>${esc(payLabel(i.PaymentMethod))}</td>
      <td class="r num">${money(i.TotalAmount)}</td><td>${statusTag(i.PaymentStatus)}</td></tr>`).join('')}</table>
    <div style="margin-top:10px;font-size:13px;color:var(--muted)" class="num">${list.length} ໃບ · ລວມ ${money(sum)} · ຍັງບໍ່ຈ່າຍ ${money(unpaid)}</div>`
    : '<div class="empty">ບໍ່ມີໃບບິນໃນລາຍການນີ້</div>';
}
function exportInvoices(){
  downloadCSV('invoices.csv', [['ເລກບິນ','ວັນທີ','ລູກຄ້າ','ເບີໂທ','ຍອດ','ວິທີຊຳລະ','ເງິນສົດ','ເງິນໂອນ','ສະຖານະ','ໝາຍເຫດ']]
    .concat(filteredInvoices().map(i => [i.InvoiceNo, fmtDate(i.Date), i.CustomerName, i.Phone, i.TotalAmount, payLabel(i.PaymentMethod),
      i.CashAmount ?? '', i.TransferAmount ?? '', i.PaymentStatus === 'Paid' ? 'ຈ່າຍແລ້ວ' : 'ຍັງບໍ່ຈ່າຍ', i.Note])));
}

async function showInvoice(no){
  openModal('ໃບບິນ', '<div class="empty">ກຳລັງໂຫຼດ...</div>');
  // ໃຫ້ແນ່ໃຈວ່າມີລາຍການສິນຄ້າແລ້ວ (ເພື່ອຫາໜ່ວຍນັບໃນໃບບິນ)
  if(!S.products.length){ try{ await refreshBase(); }catch(e){} }
  const [r, st] = await Promise.all([run(() => api('getInvoiceDetail', no)), api('getSettings').catch(() => ({}))]);
  if(!r) return;
  S.settings = st;
  const inv = r.invoice;
  $('#mBody').innerHTML = `<div id="receipt">${receiptHtml(inv, r.items, st)}</div>
    <div class="row mt"><span>${statusTag(inv.PaymentStatus)}</span><span class="spacer"></span>
      <button class="btn" onclick="toggleInv('${esc(no)}','${inv.PaymentStatus === 'Paid' ? 'Unpaid' : 'Paid'}')">
        ${inv.PaymentStatus === 'Paid' ? 'ປ່ຽນເປັນຍັງບໍ່ຈ່າຍ' : 'ໝາຍວ່າຈ່າຍແລ້ວ'}</button>
      <button class="btn" onclick="invoiceEditForm('${esc(no)}')">ແກ້ໄຂ</button>
      <button class="btn pri" onclick="printReceipt()">ພິມໃບບິນ</button></div>`;
}
function receiptHtml(inv, items, st){
  const sig  = String(inv.Signature || '');
  const head = store.get('pos_bill_head');
  const foot = store.get('pos_bill_foot') || 'ຂອບໃຈທີ່ອຸດໜູນ';
  const qtySum = items.reduce((s,i) => s + N(i.Quantity), 0);
  // ຮູບແບບເງິນ: ₭1.560.000 (ຈຸດຂັ້ນຫຼັກພັນ)
  const kip = n => '₭' + N(n).toLocaleString('de-DE', {maximumFractionDigits:2});
  const line = '<div style="border-top:1px solid #ddd;margin:10px 0"></div>';
  const rows = items.map(i => {
    const unit = esc(i.Unit || unitOf(i.ProductID));
    const lineTotal = i.LineTotal ?? N(i.Quantity) * N(i.UnitPrice);
    return '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:8px 0">' +
      '<div><div style="font-size:16px">' + esc(i.ProductName) + '</div>' +
      '<div style="color:#777;font-size:14px">' + esc(i.Quantity) + (unit ? ' ' + unit : '') + ' x ' + kip(i.UnitPrice) + '</div></div>' +
      '<div style="font-size:16px;font-weight:600;white-space:nowrap">' + kip(lineTotal) + '</div></div>';
  }).join('');
  return `<div style="text-align:center"><b style="font-size:18px">${esc(st.ShopName || 'ຮ້ານຂອງຂ້ອຍ')}</b><br>
    <small>${esc(st.ShopAddress || '')}${st.ShopPhone ? '<br>ໂທ ' + esc(st.ShopPhone) : ''}</small>
    ${head ? `<div style="white-space:pre-line;margin-top:6px;font-size:13px">${esc(head)}</div>` : ''}</div>
    ${line}
    <small>ເລກບິນ: ${esc(inv.InvoiceNo)}<br>ວັນທີ/ເວລາ: ${fmtDate(inv.Date)}${inv.CustomerName ? '<br>ລູກຄ້າ: ' + esc(inv.CustomerName) : ''}${inv.Phone ? ' (' + esc(inv.Phone) + ')' : ''}</small>
    ${line}
    ${rows}
    ${line}
    <div style="font-size:12px;color:#777">ທັງໝົດ ${items.length} ລາຍການ · ຈຳນວນລວມ ${qtySum}</div>
    <div style="display:flex;justify-content:space-between;font-size:18px;font-weight:700;margin-top:6px">
      <span>ລວມທັງໝົດ</span><span>${kip(inv.TotalAmount)}</span></div>
    <small>ຊຳລະ: ${esc(payLabel(inv.PaymentMethod))}${inv.PaymentMethod === 'Cash+Transfer' ? ` (ສົດ ${kip(inv.CashAmount)} / ໂອນ ${kip(inv.TransferAmount)})` : ''}
      · ${inv.PaymentStatus === 'Paid' ? 'ຈ່າຍແລ້ວ' : 'ຍັງບໍ່ຈ່າຍ'}${inv.Note ? '<br>ໝາຍເຫດ: ' + esc(inv.Note) : ''}</small>
    ${sig.startsWith('data:image') ? `<div style="text-align:center;margin-top:10px"><img src="${esc(sig)}" style="width:180px" alt="ລາຍເຊັນ"><br><small>ລາຍເຊັນລູກຄ້າ</small></div>` : ''}
    ${st.QRCodeURL && inv.PaymentStatus !== 'Paid' ? `<div style="text-align:center;margin-top:10px"><img src="${esc(st.QRCodeURL)}" style="width:160px" alt="QR"><br><small>ສະແກນເພື່ອໂອນ</small></div>` : ''}
    ${line}
    <div style="text-align:center;white-space:pre-line;font-size:13px">${esc(foot)}</div>`;
}
function printReceipt(){
  const w = window.open('', '_blank', 'width=420,height=640'); if(!w) return toast('ບຣາວເຊີບລັອກໜ້າຕ່າງພິມ — ກະລຸນາອະນຸຍາດ pop-up', true);
  w.document.write(`<html><head><meta charset="utf-8"><title>ໃບບິນ</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao+Looped:wght@400;700&display=swap" rel="stylesheet">
    <style>body{font-family:"Noto Sans Lao Looped",sans-serif;width:72mm;margin:0 auto;font-size:13px}table{width:100%;border-collapse:collapse}
    th,td{padding:3px 0;text-align:left;border-bottom:1px dotted #bbb}.r{text-align:right}</style></head>
    <body>${$('#receipt').innerHTML}<script>setTimeout(function(){print()},700)<\/script></body></html>`);
  w.document.close();
}
async function toggleInv(no, st){ if(await run(() => api('updateInvoicePaymentStatus', no, st), 'ອັບເດດແລ້ວ')){ showInvoice(no); if(CUR === 'invoices') loadInvoices(); } }

async function invoiceEditForm(no){
  const r = await run(() => api('getInvoiceDetail', no)); if(!r) return;
  const inv = r.invoice;
  openModal('ແກ້ໄຂໃບບິນ', `
    <div class="grid g2" style="gap:0 14px">
      <label class="f">ຊື່ລູກຄ້າ<input id="eName" value="${esc(inv.CustomerName)}"></label>
      <label class="f">ເບີໂທ<input id="ePhone" value="${esc(inv.Phone)}"></label>
    </div>
    <div class="tbl-wrap"><table id="eItems"><tr><th>ສິນຄ້າ</th><th class="r">ຈຳນວນ</th><th class="r">ລາຄາ</th></tr>
      ${r.items.map(i => `<tr data-pid="${esc(i.ProductID)}"><td>${esc(i.ProductName)}</td>
        <td class="r"><input class="inp inline num eQ" type="number" step="any" min="0" value="${esc(i.Quantity)}" style="width:80px"></td>
        <td class="r"><input class="inp inline num eP" type="number" min="0" value="${esc(i.UnitPrice)}" style="width:110px"></td></tr>`).join('')}</table></div>
    <div id="eTotal" class="num" style="text-align:right;font-weight:700;margin:8px 0 12px"></div>
    <div class="grid g2" style="gap:0 14px">
      <label class="f">ວິທີຊຳລະ<select id="eMethod">${opt('Cash','ເງິນສົດ',inv.PaymentMethod)}${opt('Transfer','ເງິນໂອນ',inv.PaymentMethod)}${opt('Cash+Transfer','ສົດ + ໂອນ',inv.PaymentMethod)}</select></label>
      <label class="f">ສະຖານະ<select id="eStatus">${opt('Paid','ຈ່າຍແລ້ວ',inv.PaymentStatus)}${opt('Unpaid','ຍັງບໍ່ຈ່າຍ',inv.PaymentStatus)}</select></label>
    </div>
    <div class="grid g2" id="eSplit" style="gap:0 14px">
      <label class="f">ເງິນສົດ<input id="eCash" type="number" value="${esc(inv.CashAmount ?? '')}"></label>
      <label class="f">ເງິນໂອນ<input id="eTr" type="number" value="${esc(inv.TransferAmount ?? '')}"></label>
    </div>
    <label class="f">ໝາຍເຫດ<input id="eNote" value="${esc(inv.Note)}"></label>
    <p style="font-size:13px;color:var(--muted)">ການປ່ຽນຈຳນວນຈະປັບສະຕັອກໃຫ້ອັດຕະໂນມັດ. ຕັ້ງຈຳນວນເປັນ 0 ເພື່ອຄືນສິນຄ້າລາຍການນັ້ນ.</p>
    <div class="row"><span class="spacer"></span><button class="btn" onclick="showInvoice('${esc(no)}')">ຍົກເລີກ</button><button class="btn pri" id="eSave">ບັນທຶກ</button></div>`);
  const readItems = () => [...document.querySelectorAll('#eItems tr[data-pid]')].map(tr => ({ productId:tr.dataset.pid,
    quantity:Number(tr.querySelector('.eQ').value)||0, unitPrice:Number(tr.querySelector('.eP').value)||0 }));
  const calc = () => { const t = readItems().reduce((s,i) => s + i.quantity*i.unitPrice, 0); $('#eTotal').textContent = 'ລວມ ' + money(t); return t; };
  const showSplit = () => $('#eSplit').style.display = $('#eMethod').value === 'Cash+Transfer' ? 'grid' : 'none';
  $('#eItems').addEventListener('input', calc); $('#eMethod').onchange = showSplit; calc(); showSplit();
  $('#eSave').onclick = async () => {
    const total = calc(), method = $('#eMethod').value;
    let cash = method === 'Cash' ? total : 0, tr = method === 'Transfer' ? total : 0;
    if(method === 'Cash+Transfer'){ cash = Number($('#eCash').value)||0; tr = Number($('#eTr').value)||0;
      if(Math.abs(cash + tr - total) > 0.001) return toast('ສົດ + ໂອນ ຕ້ອງເທົ່າກັບ ' + money(total), true); }
    $('#eSave').disabled = true;
    const ok = await run(() => api('updateInvoice', { invoiceNo:no, customerName:$('#eName').value, phone:$('#ePhone').value,
      items:readItems(), paymentMethod:method, paymentStatus:$('#eStatus').value, note:$('#eNote').value }));
    if(!ok){ $('#eSave').disabled = false; return; }
    await run(() => api('setInvoiceSplitAmounts', no, method, cash, tr));
    toast('ບັນທຶກແລ້ວ'); showInvoice(no); if(CUR === 'invoices') loadInvoices();
  };
}

/* ======================= CUSTOMERS ======================= */
async function loadCustomers(){ S.customers = await api('getCustomers'); renderCustomers(); }
$('#custSearch').oninput = renderCustomers;
function renderCustomers(){
  const q = $('#custSearch').value.trim().toLowerCase();
  const list = S.customers.filter(c => !q || (String(c.CustomerName) + ' ' + String(c.Phone)).toLowerCase().includes(q));
  $('#custTable').innerHTML = list.length ? `<table><tr><th>ຊື່</th><th>ເບີໂທ</th><th>ທີ່ຢູ່</th><th class="r">ຊື້</th><th class="r">ຍອດຊື້ລວມ</th><th></th></tr>
    ${list.map(c => `<tr class="click" onclick="custHistory('${esc(c.CustomerID)}')"><td><b>${esc(c.CustomerName)}</b></td><td>${esc(c.Phone)}</td>
      <td>${esc(c.Address)}</td><td class="r num">${c.TotalOrders || 0}</td><td class="r num">${money(c.TotalSpent)}</td>
      <td class="r"><button class="btn sm" onclick="event.stopPropagation();customerForm('${esc(c.CustomerID)}')">ແກ້ໄຂ</button>
        <button class="btn sm danger" onclick="event.stopPropagation();delCustomer('${esc(c.CustomerID)}')">ລົບ</button></td></tr>`).join('')}</table>`
    : '<div class="empty">ຍັງບໍ່ມີລູກຄ້າ</div>';
}
function customerForm(id){
  const c = S.customers.find(x => x.CustomerID === id) || {};
  openModal(id ? 'ແກ້ໄຂລູກຄ້າ' : 'ເພີ່ມລູກຄ້າ', `
    <label class="f">ຊື່ *<input id="cName" value="${esc(c.CustomerName)}"></label>
    <label class="f">ເບີໂທ<input id="cPhone" value="${esc(c.Phone)}"></label>
    <label class="f">ອີເມວ<input id="cEmail" value="${esc(c.Email)}"></label>
    <label class="f">ທີ່ຢູ່<input id="cAddr" value="${esc(c.Address)}"></label>
    <div class="row"><span class="spacer"></span><button class="btn" onclick="closeModal()">ຍົກເລີກ</button><button class="btn pri" id="cSave">ບັນທຶກ</button></div>`);
  $('#cSave').onclick = async () => {
    const d = { customerId:id, customerName:$('#cName').value.trim(), phone:$('#cPhone').value, email:$('#cEmail').value, address:$('#cAddr').value };
    if(!d.customerName) return toast('ກະລຸນາປ້ອນຊື່', true);
    if(await run(() => api(id ? 'updateCustomer' : 'addCustomer', d), 'ບັນທຶກແລ້ວ')){ closeModal(); loadCustomers(); }
  };
}
async function delCustomer(id){ if(!confirm('ລົບລູກຄ້ານີ້?')) return; if(await run(() => api('deleteCustomer', id), 'ລົບແລ້ວ')) loadCustomers(); }
async function custHistory(id){
  const c = S.customers.find(x => x.CustomerID === id) || {};
  openModal('ລູກຄ້າ: ' + (c.CustomerName || ''), '<div class="empty">ກຳລັງໂຫຼດ...</div>');
  const h = await run(() => api('getCustomerOrderHistory', id)); if(!h) return;
  const total = h.reduce((s,x) => s + (Number(x.TotalPrice)||0), 0);
  $('#mBody').innerHTML = `<div class="row" style="margin-bottom:12px"><small>${esc(c.Phone || '')} ${esc(c.Email || '')} ${esc(c.Address || '')}</small><span class="spacer"></span>
      <button class="btn sm" data-n="${esc(c.CustomerName)}" onclick="custDebt(this.dataset.n)">ເບິ່ງໜີ້</button>
      <button class="btn sm pri" onclick="sellTo('${esc(id)}')">ຂາຍໃຫ້ລູກຄ້ານີ້</button></div>` +
    (h.length ? `<div class="tbl-wrap"><table><tr><th>ວັນທີ</th><th>ສິນຄ້າ</th><th class="r">ຈຳນວນ</th><th class="r">ລາຄາ</th><th class="r">ລວມ</th></tr>
    ${h.map(x => `<tr><td>${fmtDate(x.Date)}</td><td>${esc(x.ProductName)}</td><td class="r num">${x.Quantity}</td><td class="r num">${money(x.UnitPrice)}</td><td class="r num">${money(x.TotalPrice)}</td></tr>`).join('')}</table></div>
    <div class="num" style="text-align:right;font-weight:700;margin-top:8px">ຊື້ລວມ ${money(total)}</div>`
    : '<div class="empty">ລູກຄ້ານີ້ຍັງບໍ່ມີປະຫວັດການຊື້</div>');
}
function sellTo(id){
  const c = S.customers.find(x => x.CustomerID === id) || {};
  closeModal(); cart.customerId = id; cart.customerName = c.CustomerName || ''; cart.phone = String(c.Phone || ''); go('pos');
}
function custDebt(name){ closeModal(); $('#debtSearch').value = name; go('debts'); debtCustomerSummary(); }

/* ======================= DEBTS ======================= */
const DEBT_FN = {
  1:{ list:'getDebtRecords', sum:'getDebtSummary', save:'saveDebtRecord', update:'updateDebtRecord', status:'updateDebtStatus',
      del:'deleteDebtRecord', upload:'uploadDebtImage', analyze:'analyzeDebtImage', cust:'getCustomerDebtSummary' },
  2:{ list:'debt2_getRecords', sum:'debt2_getSummary', save:'debt2_saveRecord', update:'debt2_updateRecord', status:'debt2_updateStatus',
      del:'debt2_deleteRecord', upload:'debt2_uploadImage', analyze:'debt2_analyzeImage', cust:'debt2_getCustomerSummary' },
  3:{ list:'debt3_getRecords', sum:'debt3_getSummary', save:'debt3_saveRecord', update:'debt3_updateRecord', status:'debt3_updateStatus',
      del:'debt3_deleteRecord', upload:'debt3_uploadImage', analyze:'debt3_analyzeImage', cust:'debt3_getCustomerSummary' }
};
const dfn = k => DEBT_FN[$('#debtBook').value][k];
let DEBTS = [];
$('#debtBook').value = store.get('pos_debt_book') || '1';
$('#debtBook').onchange = () => { store.set('pos_debt_book', $('#debtBook').value); loadDebts(); };
$('#debtFilter').onchange = renderDebts;
$('#debtSearch').oninput = renderDebts;

async function loadDebts(){
  const [list, sum] = await Promise.all([api(dfn('list')), api(dfn('sum'))]);
  DEBTS = list;
  const c = (lbl, x) => `<div class="panel stat"><div class="lbl">${lbl}</div><div class="val num">${money(x.total)}</div>
    <div class="sub num">ຄ້າງ ${money(x.unpaid)} · ${x.count} ລາຍການ</div></div>`;
  $('#debtSummary').innerHTML = `<div class="panel stat warn"><div class="lbl">ໜີ້ຄ້າງທັງໝົດ</div><div class="val num">${money(sum.totalUnpaidAll)}</div>
    <div class="sub">${sum.unpaidCountAll} ລາຍການ</div></div>${c('ມື້ນີ້', sum.daily)}${c('ອາທິດນີ້', sum.weekly)}${c('ເດືອນນີ້', sum.monthly)}`;
  renderDebts();
}
function renderDebts(){
  const f = $('#debtFilter').value, q = $('#debtSearch').value.trim().toLowerCase();
  const list = DEBTS.filter(d => (f === 'all' || d.Status === f) && (!q || String(d.CustomerName).toLowerCase().includes(q)));
  $('#debtTable').innerHTML = list.length ? `<table><tr><th>ວັນທີເອົາເຄື່ອງ</th><th>ລູກຄ້າ</th><th>ລາຍການ</th><th class="r">ຍອດ</th><th>ສະຖານະ</th><th></th></tr>
    ${list.map(d => `<tr class="click" onclick="debtForm('${esc(d.DebtID)}')"><td>${fmtDay(d.DateTaken)}</td>
      <td><b>${esc(d.CustomerName)}</b>${d.Phone ? '<br><small>' + esc(d.Phone) + '</small>' : ''}</td>
      <td><small>${d.Items.map(i => esc(i.name)).join(', ')}</small></td><td class="r num">${money(d.TotalAmount)}</td><td>${statusTag(d.Status)}</td>
      <td class="r"><button class="btn sm" onclick="event.stopPropagation();toggleDebt('${esc(d.DebtID)}','${d.Status === 'Paid' ? 'Unpaid' : 'Paid'}')">
        ${d.Status === 'Paid' ? 'ຍົກເລີກຈ່າຍ' : 'ຈ່າຍແລ້ວ'}</button></td></tr>`).join('')}</table>`
    : '<div class="empty">ບໍ່ມີລາຍການໜີ້</div>';
}
async function toggleDebt(id, st){ if(await run(() => api(dfn('status'), id, st), 'ອັບເດດແລ້ວ')) loadDebts(); }

function debtForm(id){
  const d = DEBTS.find(x => x.DebtID === id) || { Items:[], Status:'Unpaid' };
  let items = d.Items.map(i => ({ name:i.name, price:i.price }));
  openModal(id ? 'ແກ້ໄຂລາຍການໜີ້' : 'ບັນທຶກໜີ້ໃໝ່', `
    ${id ? '' : `<div class="panel" style="background:var(--gold-soft);border-color:#EBD9A6;margin-bottom:14px">
      <b>ອ່ານຈາກຮູບໃບບັນທຶກ</b><br><small>ຖ່າຍຮູບ ຫຼື ເລືອກຮູບໃບໜີ້ ແລ້ວ AI ຈະປ້ອນຂໍ້ມູນໃຫ້ (ກວດຄືນກ່ອນບັນທຶກ)</small>
      <input type="file" id="dImgFile" accept="image/*" capture="environment" class="inp"><div id="dAiState" style="font-size:13px;margin-top:6px"></div></div>`}
    ${d.ImageURL ? `<a href="${esc(d.ImageURL)}" target="_blank"><img src="${esc(d.ImageURL)}" style="max-width:160px;border-radius:8px" alt="ຮູບໃບບັນທຶກ"></a>` : ''}
    <input type="hidden" id="dImg" value="${esc(d.ImageURL)}">
    <div class="grid g2" style="gap:0 14px">
      <label class="f">ຊື່ລູກຄ້າ *<input id="dName" list="dCustList" value="${esc(d.CustomerName)}"></label>
      <label class="f">ເບີໂທ<input id="dPhone" value="${esc(d.Phone)}"></label>
      <label class="f">ວັນທີເອົາເຄື່ອງ<input id="dDate" type="date" value="${d.DateTaken ? ymd(d.DateTaken) : today()}"></label>
      <label class="f">ສະຖານະ<select id="dStatus"><option value="Unpaid">ຍັງຄ້າງ</option><option value="Paid" ${d.Status === 'Paid' ? 'selected' : ''}>ຈ່າຍແລ້ວ</option></select></label>
    </div>
    <datalist id="dCustList">${[...new Set(DEBTS.map(x => x.CustomerName))].map(n => `<option value="${esc(n)}">`).join('')}</datalist>
    <b>ລາຍການເຄື່ອງ</b><div id="dItems"></div>
    <button class="btn sm" id="dAdd" style="margin:6px 0 12px">+ ເພີ່ມລາຍການ</button>
    <label class="f">ໝາຍເຫດ<input id="dNote" value="${esc(d.Note)}"></label>
    <div class="row">${id ? '<button class="btn danger" id="dDel">ລົບ</button>' : ''}<span class="spacer"></span>
      <button class="btn" onclick="closeModal()">ຍົກເລີກ</button><button class="btn pri" id="dSave">ບັນທຶກ</button></div>`);

  const drawItems = () => {
    const total = items.reduce((s,i) => s + (Number(i.price)||0), 0);
    $('#dItems').innerHTML = items.map((it,k) => `<div class="row" style="margin-top:6px">
      <input class="inp" style="flex:2;margin:0" placeholder="ຊື່ເຄື່ອງ" value="${esc(it.name)}" oninput="this.closest('#dItems')._items[${k}].name=this.value">
      <input class="inp num" style="flex:1;margin:0" type="number" placeholder="ລາຄາ" value="${it.price}" onchange="this.closest('#dItems')._items[${k}].price=this.value;this.closest('#dItems')._draw()">
      <button class="btn sm danger" onclick="this.closest('#dItems')._items.splice(${k},1);this.closest('#dItems')._draw()">×</button></div>`).join('')
      + `<div style="text-align:right;font-weight:700;margin-top:8px" class="num">ລວມ ${money(total)}</div>`;
  };
  $('#dItems')._items = items; $('#dItems')._draw = drawItems; drawItems();
  $('#dAdd').onclick = () => { items.push({ name:'', price:0 }); drawItems(); };

  if(!id) $('#dImgFile').onchange = async e => {
    const f = e.target.files[0]; if(!f) return;
    const st = $('#dAiState'); st.textContent = 'ກຳລັງອັບໂຫຼດ ແລະ ໃຫ້ AI ອ່ານຮູບ...';
    try{
      const b = await fileToBase64(f);
      const [up, ai] = await Promise.all([api(dfn('upload'), b.base64, b.mime, f.name), api(dfn('analyze'), b.base64, b.mime)]);
      if(up.success) $('#dImg').value = up.url;
      if(!ai.success){ st.textContent = ai.message; st.style.color = 'var(--red)'; return; }
      const x = ai.data;
      if(x.customerName) $('#dName').value = x.customerName;
      if(x.phone) $('#dPhone').value = x.phone;
      if(x.dateTaken) $('#dDate').value = x.dateTaken;
      $('#dStatus').value = x.status;
      items.splice(0, items.length, ...x.items); drawItems();
      st.style.color = 'var(--jade)'; st.textContent = `AI ອ່ານໄດ້ ${x.items.length} ລາຍການ — ກະລຸນາກວດຄືນກ່ອນບັນທຶກ`;
    }catch(err){ st.textContent = err.message; st.style.color = 'var(--red)'; }
  };

  $('#dSave').onclick = async () => {
    const data = { debtId:id, customerName:$('#dName').value.trim(), phone:$('#dPhone').value, dateTaken:$('#dDate').value,
      status:$('#dStatus').value, note:$('#dNote').value, imageUrl:$('#dImg').value,
      items: items.filter(i => String(i.name).trim()).map(i => ({ name:String(i.name).trim(), price:Number(i.price)||0 })) };
    if(!data.customerName) return toast('ກະລຸນາປ້ອນຊື່ລູກຄ້າ', true);
    if(!data.items.length) return toast('ກະລຸນາເພີ່ມລາຍການເຄື່ອງຢ່າງໜ້ອຍ 1 ລາຍການ', true);
    $('#dSave').disabled = true;
    if(await run(() => api(id ? dfn('update') : dfn('save'), data), 'ບັນທຶກແລ້ວ')){ closeModal(); loadDebts(); }
    else $('#dSave').disabled = false;
  };
  if(id) $('#dDel').onclick = async () => { if(!confirm('ລົບລາຍການໜີ້ນີ້?')) return;
    if(await run(() => api(dfn('del'), id), 'ລົບແລ້ວ')){ closeModal(); loadDebts(); } };
}

function exportDebts(){
  const f = $('#debtFilter').value, q = $('#debtSearch').value.trim().toLowerCase();
  const list = DEBTS.filter(d => (f === 'all' || d.Status === f) && (!q || String(d.CustomerName).toLowerCase().includes(q)));
  downloadCSV('debts.csv', [['DebtID','ວັນທີເອົາເຄື່ອງ','ລູກຄ້າ','ເບີໂທ','ລາຍການ','ຍອດ','ສະຖານະ','ໝາຍເຫດ']]
    .concat(list.map(d => [d.DebtID, fmtDay(d.DateTaken), d.CustomerName, d.Phone, d.Items.map(i => i.name + ' ' + i.price).join('; '),
      d.TotalAmount, d.Status === 'Paid' ? 'ຈ່າຍແລ້ວ' : 'ຍັງຄ້າງ', d.Note])));
}
async function runDebug(){
  $('#dbgOut').textContent = 'ກຳລັງກວດ...';
  try{ $('#dbgOut').textContent = await api('debugCheckDataForWeb'); }catch(e){ $('#dbgOut').textContent = e.message; }
}
async function debtCustomerSummary(){
  const name = $('#debtSearch').value.trim(); if(!name) return toast('ພິມຊື່ລູກຄ້າກ່ອນ', true);
  const r = await run(() => api(dfn('cust'), name)); if(!r) return;
  openModal('ຍອດໜີ້: ' + r.customerName, `
    <div class="grid g3" style="gap:10px">
      <div class="panel stat warn"><div class="lbl">ຍັງຄ້າງ</div><div class="val num">${money(r.unpaidTotal)}</div></div>
      <div class="panel stat"><div class="lbl">ຈ່າຍແລ້ວ</div><div class="val num">${money(r.paidTotal)}</div></div>
      <div class="panel stat"><div class="lbl">ລວມທັງໝົດ</div><div class="val num">${money(r.totalAmount)}</div><div class="sub">${r.recordCount} ຄັ້ງ</div></div>
    </div>
    <div class="tbl-wrap mt"><table><tr><th>ວັນທີ</th><th>ເຄື່ອງ</th><th class="r">ລາຄາ</th><th>ສະຖານະ</th></tr>
    ${r.items.map(i => `<tr><td>${fmtDay(i.date)}</td><td>${esc(i.name)}</td><td class="r num">${money(i.price)}</td><td>${statusTag(i.status)}</td></tr>`).join('')}</table></div>`);
}

/* ======================= SETTINGS ======================= */
async function loadSettings(){
  $('#cfgUrl').value = store.get('pos_api_url') || DEFAULT_API_URL; $('#cfgToken').value = store.get('pos_api_token') || DEFAULT_API_TOKEN;
  $('#sHead').value = store.get('pos_bill_head'); $('#sFoot').value = store.get('pos_bill_foot');
  if(!(store.get('pos_api_url') || DEFAULT_API_URL)) return;
  const [st, u] = await Promise.all([api('getSettings'), api('getUnits')]);
  S.settings = st; S.units = u;
  $('#sName').value = st.ShopName || ''; $('#sPhone').value = st.ShopPhone || ''; $('#sAddr').value = st.ShopAddress || '';
  $('#sKeyState').innerHTML = st.HasGeminiKey ? '<span class="tag paid">ຕັ້ງຄ່າແລ້ວ</span>' : '<span class="tag unpaid">ຍັງບໍ່ໄດ້ຕັ້ງ</span>';
  $('#sQrPrev').innerHTML = st.QRCodeURL ? `<img src="${esc(st.QRCodeURL)}" style="width:120px;margin-bottom:10px" alt="QR">` : '';
  $('#sQrPrev').dataset.url = st.QRCodeURL || '';
  renderUnits();
}
$('#sHead').oninput = e => store.set('pos_bill_head', e.target.value);
$('#sFoot').oninput = e => store.set('pos_bill_foot', e.target.value);
async function saveConn(){
  store.set('pos_api_url', $('#cfgUrl').value.trim()); store.set('pos_api_token', $('#cfgToken').value.trim());
  if(await run(() => api('getSettings'), 'ເຊື່ອມຕໍ່ສຳເລັດ')){ loadSettings(); applyBrand(); }
}
$('#sQrFile').onchange = async e => {
  const f = e.target.files[0]; if(!f) return;
  const b = await fileToBase64(f, 800);
  const r = await run(() => api('uploadProductImage', b.base64, b.mime, 'qr_' + f.name));
  if(r){ $('#sQrPrev').dataset.url = r.url; $('#sQrPrev').innerHTML = `<img src="${esc(r.url)}" style="width:120px;margin-bottom:10px" alt="QR">`; toast('ອັບໂຫຼດແລ້ວ — ກົດບັນທຶກຂໍ້ມູນຮ້ານ'); }
};
async function saveShop(){
  const p = { shopName:$('#sName').value, shopPhone:$('#sPhone').value, shopAddress:$('#sAddr').value, qrCodeUrl:$('#sQrPrev').dataset.url || '' };
  if($('#sKey').value.trim()) p.geminiApiKey = $('#sKey').value.trim();
  if(await run(() => api('saveSettings', p), 'ບັນທຶກແລ້ວ')){ $('#sKey').value = ''; loadSettings(); applyBrand(); }
}
function renderUnits(){
  $('#unitList').innerHTML = S.units.length ? `<table>${S.units.map(u => `<tr><td>${esc(u.UnitName)}</td>
    <td>${(u.IsWeight === true || String(u.IsWeight).toLowerCase() === 'true') ? '<small>ຊັ່ງນ້ຳໜັກ</small>' : ''}</td>
    <td class="r"><button class="btn sm" onclick="unitForm('${esc(u.UnitID)}')">ແກ້ໄຂ</button>
    <button class="btn sm danger" onclick="delUnit('${esc(u.UnitID)}')">ລົບ</button></td></tr>`).join('')}</table>` : '<div class="empty">ຍັງບໍ່ມີໜ່ວຍນັບ</div>';
}
function unitForm(id){
  const u = S.units.find(x => x.UnitID === id) || {};
  const w = u.IsWeight === true || String(u.IsWeight).toLowerCase() === 'true';
  openModal(id ? 'ແກ້ໄຂໜ່ວຍນັບ' : 'ເພີ່ມໜ່ວຍນັບ', `
    <label class="f">ຊື່ໜ່ວຍ<input id="uName" value="${esc(u.UnitName)}"></label>
    <label style="display:flex;gap:8px;align-items:center;margin-bottom:14px"><input type="checkbox" id="uW" ${w ? 'checked' : ''}> ຂາຍຕາມນ້ຳໜັກ (ໃສ່ທົດສະນິຍົມໄດ້)</label>
    <div class="row"><span class="spacer"></span><button class="btn" onclick="closeModal()">ຍົກເລີກ</button><button class="btn pri" id="uSave">ບັນທຶກ</button></div>`);
  $('#uSave').onclick = async () => {
    const d = { unitId:id, unitName:$('#uName').value.trim(), isWeight:$('#uW').checked };
    if(!d.unitName) return toast('ກະລຸນາປ້ອນຊື່', true);
    if(await run(() => api(id ? 'updateUnit' : 'addUnit', d), 'ບັນທຶກແລ້ວ')){ closeModal(); loadSettings(); }
  };
}
async function delUnit(id){ if(!confirm('ລົບໜ່ວຍນັບນີ້?')) return; if(await run(() => api('deleteUnit', id), 'ລົບແລ້ວ')) loadSettings(); }

async function applyBrand(){
  try{ const st = await api('getSettings'); S.settings = st;
    if(st.ShopName){ $('#brandSub').textContent = st.ShopName; document.title = st.ShopName + ' — POS'; } }catch(e){}
}

/* ======================= START ======================= */
if(!(store.get('pos_api_token') || DEFAULT_API_TOKEN)) { go('settings'); toast('ກະລຸນາໃສ່ລະຫັດ API ເພື່ອເລີ່ມໃຊ້ງານ'); }
else { go(store.get('pos_view') || 'dash'); applyBrand(); }
</script>
</body>
